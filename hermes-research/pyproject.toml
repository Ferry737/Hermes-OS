[project]
name = "hermes-research"
version = "0.1.0"
description = "Hermes Research Engine: autonomous fintech research pipeline (see ../profile.md)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hre = "hre.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
